services:
  - type: web
    name: freelance-escrow-dapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: CHAIN_ID
        value: 11155111
      - key: NETWORK_NAME
        value: Sepolia
      - key: EXPLORER_URL
        value: https://sepolia.etherscan.io
      - key: CONTRACT_ADDRESS
        sync: false
